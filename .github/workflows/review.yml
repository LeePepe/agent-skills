name: review

# Evaluated from the trusted default branch. The pinned reusable workflows guard
# forks and review the diff as data; they never execute the PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review-target:
    uses: LeePepe/shared-ci/.github/workflows/codex-review.yml@761fe6b0b3ca5e2c57d244182d495ab8041851fa
  kimi-review:
    uses: LeePepe/shared-ci/.github/workflows/kimi-review.yml@761fe6b0b3ca5e2c57d244182d495ab8041851fa
